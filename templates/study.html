{% extends "base.html" %}{% block title %}單字 | WordQuest{% endblock %}{% block content %}<section class="study-hero"><div><p class="eyebrow">Study</p><h1>先背單字：先看情境，再記單字</h1></div><a class="primary-action" href="{{ url_for('map_page') }}">開始破關</a></section><section class="study-grid">{% for item in words %}<article class="study-card"><div><p class="eyebrow">{{ item.pos }}</p><h2>{{ item.word }}</h2><strong>{{ item.zh }}</strong></div><p>{{ item.context }}</p><small>{{ item.memory }}</small><div class="study-card-footer"><small>{{ item.example }}</small><button class="sound-button" type="button" data-speak-word="{{ item.word }}">聽發音</button></div></article>{% endfor %}</section>{% endblock %}
