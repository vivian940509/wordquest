<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101429"><title>{% block title %}WordQuest{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body>
<header class="topbar"><a class="brand" href="{{ url_for('index') }}">WordQuest</a><button class="nav-toggle" type="button" data-nav-toggle>☰</button><nav data-nav><a href="{{ url_for('map_page') }}">關卡地圖</a><a href="{{ url_for('study') }}">單字</a><a href="{{ url_for('mistakes') }}">錯題</a><a href="{{ url_for('vocabulary') }}">馴服冊</a><a href="{{ url_for('shop') }}">商店</a><a href="{{ url_for('friends') }}">對戰</a></nav></header>
<main>{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><script src="{{ url_for('static', filename='js/app.js') }}"></script></body></html>
