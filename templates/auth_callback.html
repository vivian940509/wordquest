{% extends "base.html" %}{% block title %}Google 登入 | WordQuest{% endblock %}{% block content %}<section class="auth-card"><h1>正在完成 Google 登入…</h1><p data-auth-status>請稍候。</p></section><script>(async()=>{const p=new URLSearchParams(location.hash.slice(1));const token=p.get('access_token');const el=document.querySelector('[data-auth-status]');if(!token){el.textContent='Google 登入失敗：沒有收到登入憑證。';return;}try{const r=await fetch('{{ url_for("google_complete") }}',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({access_token:token})});const d=await r.json();if(!d.ok)throw new Error(d.error||'登入失敗');location.replace(d.redirect||'/');}catch(e){el.textContent=e.message;}})();</script>{% endblock %}
