{% extends "base.html" %}{% block title %}重設密碼 | WordQuest{% endblock %}{% block content %}<section class="auth-card"><p class="eyebrow">New Password</p><h1>設定新密碼</h1><form class="stack-form" method="post" data-reset-form><input type="hidden" name="access_token" data-reset-token><label>新密碼<input type="password" name="password" minlength="6" required autocomplete="new-password"></label><button class="primary-action">更新密碼</button></form><p class="auth-hint" data-reset-hint>正在確認重設連結…</p></section><script>const h=new URLSearchParams(location.hash.slice(1));const t=h.get('access_token');const f=document.querySelector('[data-reset-token]');const hint=document.querySelector('[data-reset-hint]');if(t){f.value=t;hint.textContent='連結有效，請設定新密碼。'}else{hint.textContent='若此頁是從信箱連結開啟，請重新申請重設連結。';}</script>{% endblock %}
